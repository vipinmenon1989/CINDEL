name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  SNAKEMAKE_VERSION: "7.32.4"
  # snakemake 7.32.4 calls the deprecated pulp.list_solvers() alias at
  # import time; pulp>=2.8 dropped that alias in favor of listSolvers(),
  # which crashes `snakemake --version` / `snakemake -n` with
  # "AttributeError: module 'pulp' has no attribute 'list_solvers'"
  # on any fresh install that resolves latest pulp. Pin it.
  PULP_VERSION: "2.7.0"

jobs:
  syntax-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Compile check
        run: python -m py_compile CINDEL.py
      - name: Lint (pyflakes)
        run: |
          pip install pyflakes
          pyflakes CINDEL.py

  snakemake-dry-run:
    runs-on: ubuntu-latest
    needs: syntax-check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install snakemake
        run: pip install "snakemake==${SNAKEMAKE_VERSION}" "pulp==${PULP_VERSION}"
      - name: Show snakemake version
        run: snakemake --version
      - name: Dry run
        run: snakemake -n -p

  smoke-test:
    runs-on: ubuntu-latest
    needs: snakemake-dry-run
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install "snakemake==${SNAKEMAKE_VERSION}" "pulp==${PULP_VERSION}" pytest
      - name: Run Snakemake pipeline on demo data
        run: snakemake --cores 1 -p
      - name: Check output
        run: |
          test -f results/Score.csv
          cat results/Score.csv
      - name: Run unit tests
        run: pytest tests/ -v
      - uses: actions/upload-artifact@v4
        with:
          name: cindel-demo-results
          path: results/Score.csv
